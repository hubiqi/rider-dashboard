<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>骑手超时绩效看板</title>
<meta name="description" content="站点 / 骑手 / 日期多维超时率、复合时长、二呼单、出餐慢与剔除明细，支持上传运单明细 xlsx 本地生成">
<meta property="og:type" content="website">
<meta property="og:site_name" content="骑手超时绩效看板">
<meta property="og:title" content="骑手超时绩效看板">
<meta property="og:description" content="站点 / 骑手 / 日期多维超时率、复合时长、二呼单、出餐慢与剔除明细，支持上传运单明细 xlsx 本地生成">
<meta property="og:url" content="https://hubiqi.github.io/rider-dashboard/">
<meta property="og:image" content="https://hubiqi.github.io/rider-dashboard/preview.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hubiqi.github.io/rider-dashboard/preview.png?v=1">
<link rel="icon" href="https://hubiqi.github.io/rider-dashboard/preview.png?v=1">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#101828; --sub:#667085; --line:#eaecf0;
  --brand:#2563eb; --brand2:#7c3aed; --danger:#ef4444; --warn:#f59e0b;
  --ok:#10b981; --chip:#eef2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;padding-bottom:40px}
.wrap{max-width:1120px;margin:0 auto;padding:16px}
header.hero{background:linear-gradient(120deg,#1e3a8a 0%,#2563eb 45%,#7c3aed 100%);
  color:#fff;border-radius:18px;padding:22px 20px;position:relative;overflow:hidden}
header.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  background:rgba(255,255,255,.12);border-radius:50%}
header.hero h1{margin:0;font-size:20px;letter-spacing:.5px}
header.hero .navback{display:inline-block;margin-bottom:10px;font-size:12px;color:#fff;opacity:.85;
  text-decoration:none;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:20px}
header.hero .navback:hover{opacity:1;background:rgba(255,255,255,.26)}
header.hero .range{margin-top:6px;font-size:12.5px;opacity:.9}
header.hero .badge{display:inline-block;margin-top:12px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:20px;font-size:12px}
.sec-title{display:flex;align-items:baseline;gap:8px;margin:26px 4px 12px;font-size:15px;font-weight:700;
  flex-wrap:nowrap;white-space:nowrap}
.sec-title .dot{flex:0 0 auto;align-self:center;width:5px;height:16px;border-radius:3px;background:linear-gradient(#2563eb,#7c3aed)}.sec-title small{font-weight:400;color:var(--sub);font-size:12px;margin-left:2px;
  flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#exclSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ecard{background:#f8fafc;border:1px solid #e2e8f0;border-left:3px solid #94a3b8;border-radius:8px;padding:9px 10px}
.ecard .elab{font-size:11.5px;color:#64748b;font-weight:600}
.ecard .elab em{font-style:normal;color:#94a3b8;font-weight:400;font-size:10.5px}
.ecard .eval{font-size:20px;font-weight:800;line-height:1.25;color:#1e293b}
.ecard .ehint{font-size:10.5px;color:#94a3b8;line-height:1.4}
.ecard .ebar{height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin:5px 0 3px}
.ecard .ebar i{display:block;height:100%;border-radius:2px}
.xtab{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}
.xtab th{text-align:left;padding:7px 8px;border-bottom:2px solid #e2e8f0;font-size:11.5px;color:#64748b;white-space:nowrap}
.xtab th.num,.xtab td.num{text-align:right}
.xtab td{padding:7px 8px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
.xtab td.sname{font-weight:600;color:#1e293b}
.xtab .mut{color:#cbd5e1}
.xtab tbody tr:hover{background:#f8fafc}
.xtab td.barcell{position:relative;min-width:70px}
.xtab td.barcell .xb{position:absolute;left:8px;top:50%;transform:translateY(-50%);height:14px;background:#dbeafe;border-radius:3px;z-index:0}
.xtab td.barcell em{position:relative;z-index:1;font-style:normal;font-size:11.5px;color:#1e40af;padding-left:3px}
.emptycard{padding:26px 18px;text-align:center;background:linear-gradient(180deg,#f8fafc,#fff)}
.emptycard .eico{font-size:34px;line-height:1;margin-bottom:10px}
.emptycard .etitle{font-size:15.5px;font-weight:700;color:#1e293b;margin-bottom:8px}
.emptycard .ebody{font-size:12.5px;color:#64748b;line-height:1.75}
.emptycard .emit{color:#94a3b8;font-size:11.5px}
.btn.ghost{background:#fff;color:#475569;border:1px solid #cbd5e1;font-weight:500}
.btn.ghost:active{background:#f1f5f9}
.grid{display:grid;gap:12px}
.kpi{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06)}
.kpi .card{padding:14px 14px 15px}
.kpi .lab{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .val small{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px}
.kpi .foot{font-size:11.5px;color:var(--sub);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.up{color:var(--danger)}.down{color:var(--ok)}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600}
.pill.r{background:#fef2f2;color:#b91c1c}.pill.g{background:#ecfdf5;color:#047857}
.pill.b{background:var(--chip);color:#3730a3}
.row{display:grid;gap:12px}
@media(min-width:821px){.row.split{grid-template-columns:1.55fr 1fr}}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;background:#eef1f6;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;
  color:#475467;font-weight:600;cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(16,24,40,.12)}
select,input[type=search]{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;
  font-size:12.5px;color:var(--ink);outline:none}
input[type=search]{min-width:120px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-weight:600;font-size:11.5px;position:sticky;top:0;background:#fff;z-index:1}
tbody tr:hover{background:#fafbff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.rank{display:inline-flex;width:20px;height:20px;border-radius:6px;background:#f2f4f7;color:#475467;
  font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:7px}
.rank.t1{background:#fef3c7;color:#b45309}.rank.t2{background:#e5e7eb;color:#374151}.rank.t3{background:#fde8d7;color:#9a3412}
.bar{height:6px;border-radius:4px;background:#f2f4f7;overflow:hidden;min-width:52px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;border-radius:4px}
.scroll{max-height:460px;overflow:auto;-webkit-overflow-scrolling:touch}
.stname{font-weight:700}
.muted{color:var(--sub)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stcard{display:flex;flex-direction:column;gap:8px}
.stcard .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{padding:30px;text-align:center;color:var(--sub)}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:fixed;pointer-events:none;background:#101828;color:#fff;font-size:11.5px;padding:6px 9px;
  border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;white-space:nowrap;transform:translate(-50%,-120%)}
.note{font-size:11.5px;color:var(--sub);margin:10px 4px 0;line-height:1.7}
.note b{color:#344054}
.tagrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.taglab{font-size:12.5px;color:#475467;font-weight:600;min-width:104px}
button.tag{border:1px solid var(--line);background:#fff;color:#475467;border-radius:20px;
  padding:5px 14px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s}
button.tag:hover{border-color:#c7d2fe}
button.tag.on{background:linear-gradient(120deg,#2563eb,#7c3aed);color:#fff;border-color:transparent;
  box-shadow:0 2px 8px rgba(37,99,235,.3)}
.tagsum{font-size:12px;color:var(--sub);margin-top:2px;padding-top:10px;border-top:1px dashed var(--line)}
.tagsum b{color:var(--brand)}
.uprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:linear-gradient(120deg,#2563eb,#7c3aed);color:#fff;border:0;border-radius:10px;
  padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(37,99,235,.28)}
.btn:active{transform:translateY(1px)}
.upstatus{font-size:12px;color:var(--sub);line-height:1.6}
th.sorth{user-select:none}
th.sorth:hover{color:var(--brand)}
th.sorth.on{color:var(--brand)}
th .arrow{font-size:10px}
td .bar{margin-right:6px}
tr.rrow{cursor:pointer}
tr.rrow:active{background:#f2f6ff}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;overflow:auto;
  padding:14px;z-index:20;-webkit-backdrop-filter:blur(2px)}
.modal.show{display:flex}
.modal-card{background:#fff;border-radius:16px;max-width:760px;width:100%;margin:auto;
  max-height:calc(100vh - 28px);overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mtitle{font-size:18px;font-weight:800}
.mclose{border:0;background:#f2f4f7;color:#475467;width:30px;height:30px;border-radius:9px;font-size:14px;cursor:pointer;flex:0 0 auto}
/* 导出图片：全屏查看器 */
.modal.full{padding:0;background:rgba(16,24,40,.94);-webkit-backdrop-filter:none}
.modal.full .modal-card{max-width:none;max-height:none;width:100%;height:100%;border-radius:0;padding:0;
  display:flex;flex-direction:column;overflow:hidden}
.exp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;background:#fff}
.exp-body{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;background:#f4f6fa;padding:10px}
.exp-body img{border:1px solid #eaecf0;border-radius:8px;display:block;margin:0 auto}
.exp-foot{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--line);flex:0 0 auto;background:#fff}
.exp-foot .btn{flex:1 1 0;white-space:nowrap}
.exp-body.fith{display:flex;align-items:center;justify-content:center}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media(max-width:520px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mcell{background:#f8fafc;border:1px solid #eef1f6;border-radius:10px;padding:8px 10px}
.mcell .kl{font-size:11px;color:var(--sub)}
.mcell .kv{font-size:16px;font-weight:800;margin-top:2px}
.mlegend{display:flex;gap:16px;font-size:11.5px;color:var(--sub);margin:6px 0 2px}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.expbtn{margin-left:auto;flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#475467;
  border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:600;cursor:pointer;line-height:1.6}
.expbtn:hover{border-color:#c7d2fe;color:var(--brand)}
.btn.ghost{background:#eef1f6;color:#344054;box-shadow:none}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:#101828;color:#fff;font-size:12.5px;padding:9px 16px;border-radius:22px;
  opacity:0;pointer-events:none;transition:.22s;z-index:30;max-width:82vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <a class="navback" href="https://hubiqi.github.io/" id="navBack">← 项目导航</a>
    <h1>骑手超时绩效看板</h1>
    <div class="range" id="range"></div>
    <div class="badge" id="heroBadge"></div>
  </header>

  <div class="sec-title"><span class="dot"></span>数据源 <small>上传绩效明细 xlsx 自动刷新（本地解析，不上传服务器）</small></div>
  <div class="card">
    <div class="uprow">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.json" style="display:none">
      <button class="btn" id="upBtn">⬆ 载入数据</button>
      <button class="btn ghost" id="expDataBtn" title="把本机数据导出为 .json，便于换设备导入">⬇ 导出数据</button>
      <button class="btn ghost" id="clrBtn" title="清除本机保存的数据">🗑 清空</button>
      <span id="upStatus" class="upstatus"></span>
    </div>
  </div>

  <div id="emptyState" style="display:none">
    <div class="card emptycard">
      <div class="eico">📊</div>
      <div class="etitle">本页面不内置任何数据</div>
      <div class="ebody">
        为节省访问流量，看板只包含程序本身，<b>数据全部存放在你的设备本地</b>。<br>
        请点上方「⬆ 载入数据」选择运单明细 xlsx，或导入此前导出的数据文件（.json）。<br>
        <span class="emit">解析在本机完成，数据不会上传到任何服务器；下次打开自动恢复。</span>
      </div>
    </div>
  </div>

  <div id="dashBody" style="display:none">
  <div class="sec-title"><span class="dot"></span>筛选标签 <small>切换后以下全部指标联动</small></div>
  <div class="card" id="filterBar"></div>

  <section class="mod" data-name="昨日最新情况">
  <div class="sec-title"><span class="dot"></span>昨日最新情况 <small id="lastTag"></small></div>
  <div class="grid kpi" id="kpiLast"></div>
  </section>

  <section class="mod" data-name="全周期概览">
  <div class="sec-title"><span class="dot"></span>全周期概览</div>
  <div class="grid kpi" id="kpiAll"></div>
  </section>

  <section class="mod" data-name="日期变化趋势">
  <div class="sec-title"><span class="dot"></span>日期变化趋势 <small>超时率 / 单均复合时长 / 单量</small></div>
  <div class="card">
    <div class="ctrl">
      <div class="seg" id="metricSeg">
        <button data-m="rate" class="on">超时率</button>
        <button data-m="comp">单均复合时长</button>
        <button data-m="tot">单量</button>
      </div>
    </div>
    <div id="trendChart"></div>
    <div class="legend" id="trendLegend"></div>
    <div id="trendTable" style="margin-top:14px"></div>
  </div>
  </section>

  <section class="mod" data-name="站点维度">
  <div class="sec-title"><span class="dot"></span>站点维度 <small>全周期对比 + 最新表现</small></div>
  <div class="grid" id="stationGrid" style="grid-template-columns:repeat(2,1fr)"></div>
  </section>

  <section class="mod" data-name="骑手明细排行">
  <div class="sec-title"><span class="dot"></span>骑手明细排行</div>
  <div class="card">
    <div class="ctrl">
      <select id="daySel"></select>
      <select id="stSel"></select>
      <input type="search" id="q" placeholder="搜索骑手…">
      <span class="muted" style="font-size:12px">最少单量</span>
      <select id="minSel">
        <option value="1">1</option><option value="5" selected>5</option>
        <option value="10">10</option><option value="20">20</option><option value="50">50</option>
      </select>
      <div class="seg" id="sortSeg">
        <button data-s="o">按超时单</button>
        <button data-s="r">按超时率</button>
        <button data-s="shareO">按超时占比</button>
        <button data-s="shareS">按复合占比</button>
      </div>
    </div>
    <div class="scroll"><table id="riderTable"><thead></thead><tbody></tbody></table></div>
    <div class="note" id="tblNote"></div>
  </div>
  </section>

  <section class="mod" data-name="剔除明细">
  <div class="sec-title"><span class="dot"></span>剔除明细 <small id="exclTag"></small></div>
  <div class="card">
    <div id="exclSummary"></div>
    <div class="seg" id="exclSeg" style="margin-top:12px">
      <button data-v="st" class="on">按站点</button>
      <button data-v="rd">按骑手</button>
      <button data-v="date">按日期</button>
    </div>
    <div class="scroll" id="exclTableWrap" style="margin-top:10px"></div>
    <div class="note" id="exclNote"></div>
  </div>
  </section>

  </div><!-- /dashBody -->

  <div class="note" id="method"></div>
</div>
<div class="tip" id="tip"></div>
<div id="toast"></div>
<div class="modal" id="modal"></div>
<script src="core_v24.js?v=29"></script>
</body>
</html>
